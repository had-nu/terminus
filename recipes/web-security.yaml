name: web-security

base: alpine:3.22

packages:
  - curl
  - wget
  - nmap
  - nikto
  - sqlmap
  - gobuster
  - ffuf
  - sslscan

go_tools:
  - name: vexil
    repo: github.com/had-nu/vexil/v2/cmd/vexil
    desc: Static secret scanner for CI/CD pipelines (entropy-gated, zero deps)
  - name: wardex
    repo: github.com/had-nu/wardex/v2
    desc: Risk-based release gate for threat-informed intelligence strategies
