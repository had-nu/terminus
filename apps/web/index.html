<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERMINUS — P0 Runtime Feasibility Spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e12; color: #d7dde4;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid #1d2530;
    font-size: 13px; letter-spacing: .08em;
  }
  header .session { color: #5d6b7a; }
  #status { color: #8aa0b6; }
  #status.ready { color: #59c27b; }
  #status.error { color: #e06c75; }
  #term {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    font-size: 13.5px; line-height: 1.45; white-space: pre-wrap;
    word-break: break-all;
  }
  #bar {
    display: flex; gap: 8px; padding: 10px 16px;
    border-top: 1px solid #1d2530; font-size: 13px;
  }
  #input {
    flex: 1; background: #131820; color: #d7dde4;
    border: 1px solid #263041; border-radius: 4px;
    padding: 7px 10px; font: inherit;
  }
  #input:focus { outline: 1px solid #3d7fd6; }
  button {
    background: #1a2230; color: #d7dde4; border: 1px solid #2a3546;
    border-radius: 4px; padding: 7px 14px; font: inherit; cursor: pointer;
  }
  button:hover { background: #222c3d; }
  button.danger:hover { background: #3a1b20; border-color: #7a2e37; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: #5d6b7a; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <span>TERMINUS <span class="hint">p0 spike — v86 / Alpine x86</span></span>
    <span id="status">initializing…</span>
    <span class="session" id="session-id"></span>
  </header>

  <div id="term" aria-live="polite"></div>

  <div id="bar">
    <input id="input" placeholder="type a command and press Enter" autocomplete="off" spellcheck="false">
    <button id="boot-btn">Boot</button>
    <button id="destroy-btn" class="danger" disabled>Destroy Session</button>
  </div>

  <script src="./p0-page.js"></script>
</body>
</html>
